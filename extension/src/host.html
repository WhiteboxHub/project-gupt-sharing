<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="css/host.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center h-screen bg-slate-900 text-slate-100 p-8 antialiased">
    <div class="flex flex-col w-[70vw] h-[85vh] bg-slate-800/40 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] overflow-hidden p-8">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">Host Dashboard</h1>
                <p class="text-sm text-slate-400 mt-1">Share your screen and grant remote control natively.</p>
            </div>
            <div class="px-4 py-2 bg-black/30 rounded-lg border border-white/5">
                <span class="text-sm text-slate-400 mr-2">Status:</span>
                <span id="status-text" class="text-sm font-semibold text-yellow-400">Waiting to Share</span>
            </div>
        </header>

        <div class="flex flex-row gap-6 h-full min-h-0">
            <!-- Left panel -->
            <div class="flex-1 flex flex-col gap-6">
                <button id="share-btn" class="py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition duration-200">Start Sharing Screen</button>
                <button id="stop-btn" class="hidden py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition duration-200">Stop Sharing</button>
                
                <div id="session-info" class="hidden p-6 bg-slate-800/50 rounded-2xl border border-white/5 flex flex-col items-center">
                    <h3 class="text-sm text-slate-400 mb-2">Secure Room Code</h3>
                    <div class="flex items-center gap-4 bg-black/40 px-5 py-3 rounded-xl border border-dashed border-white/20">
                        <span id="session-id" class="text-lg font-mono font-bold text-purple-400 tracking-wider">------</span>
                        <button id="copy-btn" class="px-3 py-1 bg-white/10 hover:bg-white/20 rounded-md text-sm transition">Copy</button>
                    </div>
                </div>

                <div id="client-status" class="hidden p-6 bg-slate-800/50 rounded-2xl border border-white/5 flex flex-col h-full justify-center items-center text-center">
                    <h3 class="text-sm text-slate-400 mb-3">Remote Peer</h3>
                    <p id="client-text" class="text-sm font-medium">Waiting for connection...</p>
                </div>
            </div>

            <!-- Right panel (Preview) -->
            <div class="flex-[2] bg-black/60 rounded-2xl flex flex-col overflow-hidden relative border border-white/5 shadow-inner">
                <div class="absolute top-4 left-4 z-10 px-3 py-1 bg-black/60 rounded-full text-xs border border-white/10 backdrop-blur-md">Local Preview</div>
                <video id="local-video" class="w-full h-full object-contain" autoplay muted playsinline></video>
            </div>
        </div>
    </div>
    <script type="module" src="js/host.js"></script>
</body>
</html>
